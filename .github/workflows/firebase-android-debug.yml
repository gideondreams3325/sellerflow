name: SellerFlow Android Dual Debug & Distribution

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes for tester distribution'
        required: false
        default: 'SellerFlow Dual Debug Build - 2026 SELLER FLOW.INC'
      testers:
        description: 'Comma-separated tester emails (leave blank to use GitHub Secret TESTERS)'
        required: false
        default: ''

jobs:
  build-and-distribute:
    name: Build Both Debug APKs & Distribute
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Install NPM Dependencies
        run: npm install

      - name: 4. Build Consumer & Admin Web Applications
        run: npm run build

      - name: 5. Prepare Consumer & Admin Android Variants
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          node scripts/prepare-android-variants.js
          node scripts/patch-capacitor.js

      - name: 6. Verify Google Services JSON
        run: |
          test -s android/app/google-services.json || { echo "❌ android/app/google-services.json is missing or empty!"; exit 1; }
          echo "✅ Unified google-services.json verified."

      - name: 7. Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 8. Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-write-only: true

      - name: 9. Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: 10. Process Google Services & Build Debug APKs
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 11. Package and Verify Debug APK
        run: |
          node scripts/package-apks.js
          test -s "SellerFlow-debug.apk" || { echo "❌ SellerFlow-debug.apk missing!"; exit 1; }
          echo "✅ Unified APK verified:"
          ls -lh SellerFlow-debug.apk

      - name: 12. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SellerFlow-debug
          path: SellerFlow-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: 14. Upload APK to Firebase App Distribution
        if: success()
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID || '1:987175352360:android:9f58f9d0e4985553c61d1d' }}
          INPUT_TESTERS: ${{ github.event.inputs.testers }}
          SECRET_TESTERS: ${{ secrets.TESTERS }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes || 'SellerFlow Android Debug Build - SellerFlow' }}
        run: |
          TESTERS="${INPUT_TESTERS:-$SECRET_TESTERS}"
          
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] && [ -z "$FIREBASE_TOKEN" ]; then
            echo "=================================================================="
            echo "ℹ️ NOTICE: Firebase App Distribution credentials not yet configured."
            echo "APKs were built successfully and are available in GitHub Artifacts!"
            echo "To enable Firebase App Distribution:"
            echo "1. Add GitHub Secret 'FIREBASE_SERVICE_ACCOUNT' (Google Service Account JSON) or 'FIREBASE_TOKEN'."
            echo "2. (Optional) Add GitHub Secret 'FIREBASE_APP_ID' (Defaults to 1:987175352360:android:9f58f9d0e4985553c61d1d)."
            echo "3. (Optional) Add GitHub Secret 'TESTERS' (Comma-separated tester emails)."
            echo "=================================================================="
            exit 0
          fi
          
          echo "Uploading Consumer APK to Firebase App Distribution for App ID: $FIREBASE_APP_ID..."
          
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          fi
          
          EXTRA_ARGS=""
          if [ -n "$TESTERS" ]; then
            EXTRA_ARGS="--testers $TESTERS"
          fi
          
          npx --yes firebase-tools appdistribution:distribute "SellerFlow-Debug.apk" \
            --app "$FIREBASE_APP_ID" \
            --release-notes "$RELEASE_NOTES" \
            $EXTRA_ARGS \
            --project sellerflow-efaab
          
          echo "✅ Successfully distributed to Firebase App Distribution!"
