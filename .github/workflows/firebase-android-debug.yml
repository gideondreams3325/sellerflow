name: SellerFlow Android Debug & Firebase App Distribution

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes for tester distribution'
        required: false
        default: 'SellerFlow Debug Build - 2026 SELLER FLOW.INC'
      testers:
        description: 'Comma-separated tester emails (leave blank to use GitHub Secret TESTERS)'
        required: false
        default: ''

jobs:
  build-and-distribute:
    name: Build Debug APK & Distribute
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Install NPM Dependencies
        run: npm install

      - name: 4. Build Web Application Bundle
        run: npm run build

      - name: 5. Synchronize Web Assets to Capacitor Android
        run: |
          npx cap sync android
          node scripts/patch-capacitor.js

      - name: 6. Inject Google Services JSON
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json injected from GOOGLE_SERVICES_JSON secret."
          elif [ -f "android/app/google-services.json" ]; then
            echo "Using default repository android/app/google-services.json."
          else
            echo "Creating base google-services.json fallback..."
            node -e '
              const fs = require("fs");
              const cfg = {
                project_info: {
                  project_number: "987175352360",
                  project_id: "sellerflow-efaab",
                  storage_bucket: "sellerflow-efaab.firebasestorage.app"
                },
                client: [{
                  client_info: {
                    mobilesdk_app_id: "1:987175352360:android:9f58f9d0e4985553c61d1d",
                    android_client_info: { package_name: "com.sellerflow.app" }
                  },
                  oauth_client: [],
                  api_key: [{ current_key: "AIzaSyCyEdrUXAfgThfpStPY-Yvz8BG3LrhYuWk" }],
                  services: { appinvite_service: { other_platform_oauth_client: [] } }
                }],
                configuration_version: "1"
              };
              fs.writeFileSync("android/app/google-services.json", JSON.stringify(cfg, null, 2));
            '
          fi
          test -s android/app/google-services.json
          echo "google-services.json verified."

      - name: 7. Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 8. Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-write-only: true

      - name: 9. Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: 10. Process Google Services & Build Debug APK
        working-directory: ./android
        run: |
          ./gradlew :app:processDebugGoogleServices --no-daemon --stacktrace
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: 11. Locate and Verify Debug APK
        id: apk-check
        run: |
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✅ Success: app-debug.apk verified!"
            ls -lh android/app/build/outputs/apk/debug/app-debug.apk
            echo "apk_path=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Error: app-debug.apk file not found after build!"
            exit 1
          fi

      - name: 12. Upload Debug APK Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: SellerFlow-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: 13. Upload APK to Firebase App Distribution
        if: success()
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID || '1:987175352360:android:9f58f9d0e4985553c61d1d' }}
          INPUT_TESTERS: ${{ github.event.inputs.testers }}
          SECRET_TESTERS: ${{ secrets.TESTERS }}
          RELEASE_NOTES: ${{ github.event.inputs.release_notes || 'SellerFlow Android Debug Build - 2026 SELLER FLOW.INC' }}
        run: |
          TESTERS="${INPUT_TESTERS:-$SECRET_TESTERS}"
          
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ] && [ -z "$FIREBASE_TOKEN" ]; then
            echo "=================================================================="
            echo "ℹ️ NOTICE: Firebase App Distribution credentials not yet configured."
            echo "APK was built successfully and is available in GitHub Artifacts!"
            echo "To enable Firebase App Distribution:"
            echo "1. Add GitHub Secret 'FIREBASE_SERVICE_ACCOUNT' (Google Service Account JSON) or 'FIREBASE_TOKEN'."
            echo "2. (Optional) Add GitHub Secret 'FIREBASE_APP_ID' (Defaults to 1:987175352360:android:9f58f9d0e4985553c61d1d)."
            echo "3. (Optional) Add GitHub Secret 'TESTERS' (Comma-separated tester emails)."
            echo "=================================================================="
            exit 0
          fi
          
          echo "Uploading APK to Firebase App Distribution for App ID: $FIREBASE_APP_ID..."
          
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          fi
          
          # Use npx firebase-tools to distribute the APK
          EXTRA_ARGS=""
          if [ -n "$TESTERS" ]; then
            EXTRA_ARGS="--testers $TESTERS"
          fi
          
          npx --yes firebase-tools appdistribution:distribute "android/app/build/outputs/apk/debug/app-debug.apk" \
            --app "$FIREBASE_APP_ID" \
            --release-notes "$RELEASE_NOTES" \
            $EXTRA_ARGS \
            --project sellerflow-efaab
          
          echo "✅ Successfully distributed to Firebase App Distribution!"
