name: SellerFlow Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-apk:
    name: Build SellerFlow Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Install NPM Dependencies
        run: npm install

      - name: 4. Build Web Application
        run: npm run build

      - name: 5. Prepare Android Assets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          node scripts/prepare-android-variants.js
          node scripts/patch-capacitor.js

      - name: 6. Verify Google Services Configuration
        run: |
          test -s android/app/google-services.json || { echo "❌ android/app/google-services.json is missing or empty!"; exit 1; }
          echo "✅ Unified google-services.json verified."

      - name: 7. Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 8. Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-write-only: true

      - name: 9. Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: 10. Build SellerFlow Debug APK
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 11. Package & Validate APK Artifact
        run: |
          node scripts/package-apks.js
          test -s "SellerFlow-debug.apk" || { echo "❌ SellerFlow-debug.apk missing!"; exit 1; }
          echo "✅ APK verified successfully on disk:"
          ls -lh SellerFlow-debug.apk

      - name: 12. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SellerFlow-debug
          path: SellerFlow-debug.apk
          if-no-files-found: error
          retention-days: 30
