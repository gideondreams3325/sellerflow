name: SellerFlow Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-apk:
    name: Build SellerFlow Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Install NPM Dependencies
        run: npm install

      - name: 4. Build Web Application
        run: npm run build

      - name: 5. Synchronize Capacitor Android
        run: npx cap sync android

      - name: 6. Prepare Android Configuration & Assets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          node scripts/prepare-android-variants.js
          node scripts/patch-capacitor.js
          test -s android/app/google-services.json || { echo "❌ android/app/google-services.json is missing or empty!"; exit 1; }
          echo "✅ Unified google-services.json verified."

      - name: 7. Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 8. Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-write-only: true

      - name: 9. Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: 10. Build SellerFlow Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: 11. Verify Debug APK File Exists
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "❌ Error: Expected debug APK not found or empty at $APK_PATH"
            exit 1
          fi
          echo "✅ Debug APK verified successfully on disk:"
          ls -lh "$APK_PATH"

      - name: 12. Upload Debug APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: SellerFlow-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
