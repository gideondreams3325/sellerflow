name: SellerFlow Android Debug APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Application Bundle
        run: npm run build

      - name: Synchronize Web Assets to Capacitor Android
        run: |
          npx cap sync android
          node scripts/patch-capacitor.js

      - name: Inject Google Services JSON
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json injected from GOOGLE_SERVICES_JSON secret."
          elif [ -f "android/app/google-services.json" ]; then
            echo "Using repository android/app/google-services.json."
          else
            echo "Creating fallback google-services.json..."
            node -e '
              const fs = require("fs");
              const cfg = {
                project_info: {
                  project_number: "987175352360",
                  project_id: "sellerflow-efaab",
                  storage_bucket: "sellerflow-efaab.firebasestorage.app"
                },
                client: [{
                  client_info: {
                    mobilesdk_app_id: "1:987175352360:android:a1b2c3d4e5f67890abcdef",
                    android_client_info: { package_name: "com.sellerflow.app" }
                  },
                  oauth_client: [],
                  api_key: [{ current_key: "AIzaSyCyEdrUXAfgThfpStPY-Yvz8BG3LrhYuWk" }],
                  services: { appinvite_service: { other_platform_oauth_client: [] } }
                }],
                configuration_version: "1"
              };
              fs.writeFileSync("android/app/google-services.json", JSON.stringify(cfg, null, 2));
            '
          fi
          test -s android/app/google-services.json
          echo "google-services.json verified."

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-write-only: true

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Process Google Services & Build Debug APK
        working-directory: ./android
        run: |
          ./gradlew :app:processDebugGoogleServices --no-daemon --stacktrace
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify Debug APK and Generated Firebase Resources
        run: |
          echo "Verifying generated Firebase values.xml..."
          if [ -f "android/app/build/generated/res/google-services/debug/values/values.xml" ]; then
            echo "✅ Generated values.xml verified:"
            cat android/app/build/generated/res/google-services/debug/values/values.xml
          else
            find android/app/build/generated -name "values.xml" 2>/dev/null || true
          fi
          
          echo "Verifying debug APK binary..."
          if [ -f "android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "✅ Success: app-debug.apk verified!"
            ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          else
            echo "❌ Error: app-debug.apk file not found after build!"
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SellerFlow-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
