name: SellerFlow Dual Android Debug APKs

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-apks:
    name: Build Consumer and Admin Debug APKs
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Install NPM Dependencies
        run: npm install

      - name: 4. Build Consumer & Admin Web Applications
        run: npm run build

      - name: 5. Prepare Consumer & Admin Android Variants
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          node scripts/prepare-android-variants.js
          node scripts/patch-capacitor.js

      - name: 6. Verify Google Services Configuration
        run: |
          test -s android/app/google-services.json
          test -s android/app/src/consumer/google-services.json
          test -s android/app/src/admin/google-services.json
          echo "✅ Dual-variant google-services.json verified."

      - name: 7. Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 8. Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-write-only: true

      - name: 9. Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: 10. Build Consumer and Admin Debug APKs
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 11. Package & Validate Both APK Artifacts
        run: |
          node scripts/package-apks.js
          
          # Strict verification
          test -s "SellerFlow-Debug.apk" || { echo "❌ SellerFlow-Debug.apk missing!"; exit 1; }
          test -s "SellerFlow-Admin-Debug.apk" || { echo "❌ SellerFlow-Admin-Debug.apk missing!"; exit 1; }
          
          echo "✅ Both APKs verified successfully on disk:"
          ls -lh SellerFlow-Debug.apk SellerFlow-Admin-Debug.apk

      - name: 12. Upload Consumer Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SellerFlow-Debug
          path: SellerFlow-Debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: 13. Upload Admin Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SellerFlow-Admin-Debug
          path: SellerFlow-Admin-Debug.apk
          if-no-files-found: error
          retention-days: 30
