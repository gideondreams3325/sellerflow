name: SellerFlow Android Signed Release AAB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-release-aab:
    name: Build Signed Release Android App Bundle (AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Application Bundle
        run: npm run build

      - name: Synchronize Web Assets to Capacitor Android
        run: |
          npx cap sync android
          node scripts/patch-capacitor.js

      - name: Inject Google Services JSON from Secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Injected google-services.json from repository secret."
          fi

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-write-only: true

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Release AAB (Signed if Keystore Secret provided, else Unsigned)
        working-directory: ./android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding Android release keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > app/release-keystore.jks
            echo "Building signed release AAB..."
            ./gradlew bundleRelease \
              -Pandroid.injected.signing.store.file=$(pwd)/app/release-keystore.jks \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASSWORD" \
              --no-daemon
          else
            echo "No keystore secret provided; building unsigned release AAB..."
            ./gradlew bundleRelease --no-daemon --stacktrace
          fi

      - name: Verify Release AAB Output
        run: |
          if [ -f "android/app/build/outputs/bundle/release/app-release.aab" ]; then
            echo "✅ Success: app-release.aab verified!"
            ls -lh android/app/build/outputs/bundle/release/app-release.aab
          else
            echo "❌ Error: app-release.aab file not found after build!"
            exit 1
          fi

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SellerFlow-Android-Release-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 60
