<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd56b"/>
      <stop offset="50%" stop-color="#f5b942"/>
      <stop offset="100%" stop-color="#d99824"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#242424" stroke-width="4"/>

  <!-- Subtle glow backdrop -->
  <circle cx="256" cy="256" r="160" fill="#f5b942" opacity="0.08" filter="url(#glow)"/>

  <!-- Shopping Bag / Store Flow Icon -->
  <!-- Handle -->
  <path d="M192 190 V144 C192 108.6 220.6 80 256 80 C291.4 80 320 108.6 320 144 V190" 
        fill="none" stroke="url(#goldGrad)" stroke-width="26" stroke-linecap="round"/>

  <!-- Bag Body -->
  <path d="M136 190 L166 414 C168 428 180 438 194 438 H318 C332 438 344 428 346 414 L376 190 Z" 
        fill="url(#goldGrad)" />

  <!-- Bag inner shadow & accent -->
  <path d="M136 190 L166 414 C168 428 180 438 194 438 H318 C332 438 344 428 346 414 L376 190 Z" 
        fill="url(#goldAccent)" />

  <!-- Flow lightning / Ghana Black Star emblem -->
  <path d="M256 228 L232 306 H272 L248 388 L296 294 H256 Z" 
        fill="#080808" />
</svg>
